Title: Hyper-Dimensional Fingerprints
Description: Encodes a molecule as 32 hyperdimensional components with no training
  at all, mapping atom and bond attributes onto quasi-orthogonal random vectors and
  combining them by circular convolution through iterative message passing over the
  molecular graph. Teufel, Torresi and colleagues show that distances in this space
  track graph edit distance far more closely than Morgan fingerprints of equal width,
  improving property prediction and Bayesian optimisation at low dimensions. A fixed
  random seed keeps the encoding reproducible.
