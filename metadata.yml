Status: In progress
Title: Hyper-Dimensional Fingerprints
Description: HDF is a training-free molecular representation based on 
  hyperdimensional computing and iterative message passing. It encodes atom 
  features into high-dimensional vectors and captures molecular connectivity 
  through algebraic operations, producing deterministic fixed-length 
  fingerprints. It retains graph information better than Morgan fingerprints at 
  low dimensions, improves property prediction across benchmarks, and enhances 
  sample efficiency in Bayesian molecular optimization.
